# Netlify Configuration for FarmFlow Pro

[build]
  # Output directory containing built production assets
  publish = "dist"

  # Default build command
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Netlify Functions directory
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Proxy /api/neon/* to Netlify Functions when hosted on Netlify Edge/Serverless
[[redirects]]
  from = "/api/neon/*"
  to = "/.netlify/functions/neon/:splat"
  status = 200

# Single-Page Application (SPA) redirect rule:
# Ensures direct links and browser refreshes on sub-routes resolve to index.html with HTTP 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for all routes
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache immutable hashed assets for high performance
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Ensure entry HTML, manifest, and service worker are always fresh
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
