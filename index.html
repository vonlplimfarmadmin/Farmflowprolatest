<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>FarmFlow Pro - Broiler-Breeder Farm Management System</title>
    <meta name="description" content="FarmFlow Pro - Comprehensive poultry broiler-breeder farm management system." />
    
    <!-- PWA & Mobile Web App Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <meta name="theme-color" content="#120d18" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FarmFlow Pro" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="FarmFlow Pro" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph & Social -->
    <meta property="og:title" content="FarmFlow Pro - Broiler-Breeder Farm Management System" />
    <meta property="og:description" content="FarmFlow Pro - Comprehensive poultry broiler-breeder farm management system." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.svg" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body className="select-none overscroll-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('FarmFlow Service Worker registered', reg.scope))
            .catch(err => console.log('Service Worker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
